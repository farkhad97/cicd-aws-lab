name: Deploy AWS Infrastructure with Terraform
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Deployment
    runs-on: ubuntu-latest

    # Environment variables for AWS authentication
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout code
        # Clone the repository so the workflow has access to the source files
        uses: actions/checkout@v2

      - name: Set up Terraform
        # Install the specified version of Terraform on the runner
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.0.0

      - name: Initialize Terraform
        # Download provider plugins and set up the backend
        run: terraform init

      - name: Validate Terraform configuration
        # Check that all .tf files are syntactically correct and internally consistent
        run: terraform validate

      - name: Plan Terraform deployment
        # Preview the changes Terraform will make and save the plan to a file
        run: terraform plan -out=tfplan

      - name: Apply Terraform deployment
        # Apply the saved plan and provision the AWS infrastructure
        run: terraform apply -auto-approve tfplan
